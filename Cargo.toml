[workspace]
resolver = "3"
members = ["crates/*", "apps/bigstar", "apps/bigstar-web", "apps/bigstar-host", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
bigstar-core = { path = "crates/core" }
bigstar-nds = { path = "crates/nds" }
bigstar-formats = { path = "crates/formats" }
bigstar-level = { path = "crates/level" }
bigstar-patching = { path = "crates/patching" }
bigstar-project = { path = "crates/project" }
bigstar-protocol = { path = "crates/protocol" }
bigstar-host = { path = "crates/host" }
bigstar-client = { path = "crates/client" }
bigstar-ui-egui = { path = "crates/ui-egui" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
rmp-serde = "1"
ewebsock = "0.8"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
getrandom = "0.3"

egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
egui_dock = "0.21"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { version = "1", features = ["preserve_order"] }
nix = { version = "0.30", default-features = false, features = ["signal"] }
ctrlc = "3"
sha2 = "0.10"
serde_bytes = "0.11"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
mlua = { version = "0.11", features = ["lua54", "vendored", "send"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "warn"
indexing_slicing = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[package]
name = "bigstar"
description = "Big Star Editor desktop app: an embedded host, or a connection to a remote one"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "bigstar"
path = "src/main.rs"

[dependencies]
bigstar-client.workspace = true
bigstar-core.workspace = true
bigstar-host.workspace = true
bigstar-ui-egui.workspace = true
egui.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
log.workspace = true
rfd.workspace = true
serde_json.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Already here through the accessibility bridge; asked for the system's accent colour.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
bigstar-formats.workspace = true
bigstar-level.workspace = true
bigstar-project = { workspace = true, features = ["test-support"] }
bigstar-protocol.workspace = true
egui_kittest = { workspace = true, features = ["wgpu"] }

# The window's icon on Wayland, where winit sets none (toplevel_icon.rs).
# The same versions eframe's winit already runs on.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
rustix = { version = "1", features = ["fs"] }

# The icon and version details of the Windows executable (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

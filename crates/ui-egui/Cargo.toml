[package]
name = "bigstar-ui-egui"
description = "Big Star Editor egui frontend; swappable: nothing below depends on it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bigstar-core.workspace = true
bigstar-formats.workspace = true
bigstar-level.workspace = true
bigstar-protocol.workspace = true
bigstar-client.workspace = true
egui.workspace = true
egui_dock.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# Draws the icons (`icons.rs`) from their SVG path data. egui draws its text with the same version, so this adds
# nothing to a build.
vello_cpu = { version = "0.1", default-features = false, features = ["std", "u8_pipeline"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu"] }

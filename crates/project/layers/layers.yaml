scenes:
  # `Titlescreen_LoadTilesetGraphics` loads all three layers by file; NSMB Editor called the tileset layer a
  # "mapped tileset". It is the castle the opening cutscene plays in front of.
  - name: "Title screen"
    background:
      graphics: BG_ncg/d_2d_I_M_back_demo_castle_ncg.bin
      palette: BG_ncl/d_2d_I_M_back_demo_castle_ncl.bin
      screen: BG_nsc/d_2d_I_M_back_demo_castle_nsc.bin

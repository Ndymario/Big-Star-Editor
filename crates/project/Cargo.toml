[package]
name = "bigstar-project"
description = "Big Star Editor project layer: manifests, in-place ROM reading and the level catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# A hand-built `.nds` and a scratch directory, for tests in this crate and in the ones above it.
test-support = []

[dependencies]
bigstar-core.workspace = true
bigstar-nds.workspace = true
bigstar-formats.workspace = true
bigstar-level.workspace = true
bigstar-patching.workspace = true
serde.workspace = true

[dev-dependencies]
# The patch-apply test's fake NCPatcher writes a ROM with the synthetic builder.
bigstar-project = { path = ".", features = ["test-support"] }

# Re-runs itself as a stand-in for NCPatcher, as `project_tests.cpp` does, so it needs its own `main`.
[[test]]
name = "patch_apply"
harness = false
